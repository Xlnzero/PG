{% extends "main/base.html" %}
{% load static %}

{% block content %}
<style>
    .news-gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
    }
    .news-gallery a { display: block; }
    .news-gallery img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        display: block;
    }
    @media (max-width: 600px) {
        .news-gallery { grid-template-columns: repeat(2, 1fr); }
    }
</style>

<article class="news-post" style="max-width: 800px; margin: 0 auto 60px; padding: 160px 20px 0; font-size: 18px; line-height: 1.6;">
    <h1 style="font-size: 32px; margin-bottom: 10px;">{{ post.title }}</h1>
    <time style="display:block; color:#888; margin-bottom: 20px;" datetime="{{ post.created_at|date:'c' }}">{{ post.created_at|date:'d.m.Y' }}</time>

    <div class="news-gallery">
        {% for photo in post.photos.all %}
            <a href="{{ photo.image.url }}" target="_blank">
                <img src="{{ photo.image.url }}" alt="{{ post.title }}">
            </a>
        {% endfor %}
    </div>

    <div class="news-text">{{ post.text|linebreaks }}</div>
</article>
{% endblock %}
